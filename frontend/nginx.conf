# Раздача SPA + проксирование API на гейтвей (по имени сервиса в compose-сети)
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-роутинг: любой путь отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api-gateway:8080;
        client_max_body_size 30m;
        proxy_read_timeout 60s;
    }
}